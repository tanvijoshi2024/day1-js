<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
    </head>
    <body>
        <button onclick="document.getElementById('result').innerHTML ='result:'+ operation ">=</button>
        <button >1</button>
        <button>2</button>
        <button>3</button>
        <button>4</button>
        <button onclick="operation=operator1+operator2">+</button>
        <button onclick="operation=operator1-operator2">-</button>
        <button onclick="operation=operator1*operator2">*</button>
        <button onclick="operation=operator1/operator2">/</button>
        <p id="result"></p>

    </body>
</html>
